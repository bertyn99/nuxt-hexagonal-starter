name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (Nuxt + Pure Domain Isolation)
        run: pnpm typecheck

      - name: Lint (Oxlint + Boundary Rules)
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Run Vitest suites (unit, integration, arch, nuxt, e2e)
        run: pnpm test
        env:
          NUXT_APP_SECRET: ci-test-app-secret-with-at-least-32-characters-hexlogix

      - name: Production build
        run: pnpm build
